<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>YouTube Trend Monitor — KR 급상승</title>
    <!-- PWA: 아이폰/아이패드 홈 화면 설치용 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Trend Monitor" />
    <meta name="theme-color" content="#0b0b12" />
    <script>
      // 첫 페인트 전 테마 적용. 유효 id 목록은 src/themes.ts와 동기 유지.
      try {
        var VALID = ['neon-hunter','dawn-live','retro-arcade','deep-ocean','sunset-city',
                     'forest','monochrome','cotton-candy','cyberpunk','golden-hour'];
        var t = localStorage.getItem('yt-theme');
        if (t === 'dark') t = 'neon-hunter';   // 구버전 값 마이그레이션
        if (t === 'light') t = 'cotton-candy';
        if (VALID.indexOf(t) < 0) t = 'neon-hunter';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'neon-hunter'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // PWA 서비스 워커 — 로드 완료 후 등록(초기 렌더 경쟁 회피)
      if ('serviceWorker' in navigator) {
        addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
